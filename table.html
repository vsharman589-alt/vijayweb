<style>
  body
  {
    margin:0px;
    padding:0px;
    transition:0.50s;
    
  }
  header{

  }
  main table
  {
    width:90%;
    margin:auto;
    margin-top:10px;
    margin-bottom:50px;
    cursor:pointer;
    transition:2s;
    text-align:center;
  }
  main table th
  {
    background:rgb(66, 129, 66);
    color:white;
  }
  main table td
  {

transition:2s;

  }
  main table td:hover
  {
    background:rgb(49, 216, 141);
    transform:scale(1.10);
  }
 tr
 {

 }

   {

   }


/* Large devices (laptops/desktops, 992px and up) */
@media only screen and (min-width: 992px)
 {
 body{
  //background-color:red;
 }
header
 {
  font-size:60px;
 }
  main table
  {
    width:80%;
  }
}

nav ul li
{
     display:inline;
     list-style:none;
     padding:10px;
     background:gray;
     margin-left:-4px;
     cursor:pointer;
}
nav ul li:hover
{
    background:black; 
    color:white;
}
nav ul li a:link
{
     color:black;
     text-decoration:none;
}
nav ul li a:visited
{
     color:black;
}
nav ul li a:hover
{
color:white;
}


nav ul li:hover a:visited
{
     color:white;
     text-decoration:underline;
}


</style>
